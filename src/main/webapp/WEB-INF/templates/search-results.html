<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Tracker - Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <img src="/images/weather-app.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center" th:if="${user != null}">
            <span class="navbar-text me-3" th:text="${user.login}">User</span>
            <a class="btn btn-outline-danger" th:href="@{/auth/sign-out}">Sign out</a>
        </div>
        <div class="d-flex align-items-center" th:unless="${user != null}">
            <a class="btn btn-outline-primary me-2" th:href="@{/auth/sign-up}">Sign up</a>
            <a class="btn btn-outline-success" th:href="@{/auth/sign-in}">Sign in</a>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form class="d-flex my-4" th:action="@{/location/search}" method="get">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="location" th:value="${searchQuery}" placeholder="Enter location" required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <div>
            <h2>Search Results for "<span th:text="${searchQuery}">query</span>":</h2>
            <div class="row">
                <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="foundLocation : ${foundLocations}">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${foundLocation.name}">Location Name</h5>
                            <p class="card-text mb-1">Latitude: <span th:text="${foundLocation.latitude}">0.0</span></p>
                            <p class="card-text mb-1">Longitude: <span th:text="${foundLocation.longitude}">0.0</span></p>
                            <p class="card-text mb-1">Country: <span th:text="${foundLocation.country}">Country</span></p>
                            <p class="card-text mb-3" th:if="${foundLocation.state}">State: <span th:text="${foundLocation.state}">State</span></p>
                            <div class="mt-auto">
                                <form th:action="@{/location}" method="post">
                                    <input type="hidden" th:name="locationName" th:value="${foundLocation.name}">
                                    <input type="hidden" th:name="latitude" th:value="${foundLocation.latitude}">
                                    <input type="hidden" th:name="longitude" th:value="${foundLocation.longitude}">
                                    <button class="btn btn-primary w-100" type="submit">Add</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Tracker, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
