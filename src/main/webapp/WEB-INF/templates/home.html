<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Tracker – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <img src="../../images/weather-app.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center" th:if="${user != null}">
            <span class="navbar-text me-3" th:text="${user.login}">User</span>
            <a class="btn btn-outline-danger" th:href="@{/auth/sign-out}">Sign out</a>
        </div>
        <div class="d-flex align-items-center" th:unless="${user != null}">
            <a class="btn btn-outline-primary me-2" th:href="@{/auth/sign-up}">Sign up</a>
            <a class="btn btn-outline-success" th:href="@{/auth/sign-in}">Sign in</a>
        </div>
    </div>
</nav>

<div class="row justify-content-center" th:if="${error != null}">
    <div class="col-12 col-lg-4 col-md-6 col-sm-12">
        <div class="alert alert-danger" role="alert" th:text="${error}"></div>
    </div>
</div>

<section id="page-content">
    <div class="container mt-4">
        <form class="d-flex my-4" th:action="@{/location/search}" method="get">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="searchQuery" placeholder="Enter location" required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <div class="row" th:if="${user != null}">
            <div class="col-12 col-lg-3 col-md-6 mb-4" th:each="weather : ${weathers}">
                <div class="card h-100 position-relative weather-card">
                    <div class="position-absolute weather-card-delete-form">
                        <form th:action="@{/location/{id}(id=${weather.id})}" method="post">
                            <button class="btn-close" aria-label="Delete" type="submit"></button>
                        </form>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h1 class="card-text" th:text="${weather.temp} + '°C'">15°C</h1>
                        <h3 class="card-title" th:text="${weather.name} + ', ' + ${weather.country}">Location Name</h3>
                        <p class="card-text mb-1" th:text="'Feels like ' + ${weather.feels_like} + '°C.' + ${weather.description}">Weather description</p>
                        <p class="card-text mb-1" th:text="${weather.humidity} + '%'"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Tracker, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
