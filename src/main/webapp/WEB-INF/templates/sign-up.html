<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Tracker – Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="weather-logo"></div>
        </div>
    </div>

    <h2 class="text-center mb-5">Sign Up</h2>

    <div class="row justify-content-center" th:if="${registrationError != null}">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12">
            <div class="alert alert-danger" role="alert" th:text="${registrationError}">
                Registration error.
            </div>
        </div>
    </div>

    <div class="row justify-contnt-center">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12">
            <form th:object="${registrationRequest}" th:action="@{/auth/sign-up}" method="post" class="mt-4">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group has-validation">
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               th:classappend="${usernameError} ? ' is-invalid' : ''"
                               placeholder="you@example.com"
                               required value=""/>
                        <div class="invalid-feedback" th:if="${usernameError}" th:text="${usernameError}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group has-validation">
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               th:classappend="${passwordError} ? ' is-invalid' : ''"
                               required value=""/>
                        <div class="invalid-feedback" th:if="${passwordError}" th:text="${passwordError}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="repeatPassword" class="form-label">Repeat password</label>
                    <input type="password"
                           id="repeatPassword"
                           name="repeatPassword"
                           class="form-control"
                           th:classappend="${repeatPasswordError} ? ' is-invalid' : ''"
                           required value=""/>
                    <div class="invalid-feedback" th:if="${repeatPasswordError}" th:text="${repeatPasswordError}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                <p class="mt-2 text-center">Already have an account? <a th:href="@{/auth/sign-in}">Sign in here</a></p>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
